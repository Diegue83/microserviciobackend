spring.application.name=Ejercicio5MyAPIGestor
server.port=8081
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/dbgestor}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
# Hibernate 6 usa secuencias <tabla>_seq por defecto; se conserva la tabla hibernate_sequence existente
spring.jpa.properties.hibernate.id.db_structure_naming_strategy=legacy
